name: Keepalive

# 防 GitHub 自动停用：仓库 60 天无任何 commit 活动，会禁用所有 scheduled workflow，
# 且不会发任何通知 —— 等你发现时服务器早就被删了。
# 定时 workflow 的运行本身不算"仓库活动"，所以必须靠真实 commit 保活。
on:
  schedule:
    # 每周一 UTC 03:41 = 北京时间 11:41（同样避开整点）
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive file
        run: |
          echo "last keepalive (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" > .last-keepalive
          echo "next renew run: 每天 UTC 01:17 / 北京时间 09:17" >> .last-keepalive

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-keepalive
          git diff --staged --quiet && echo "no change, skip" && exit 0
          git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')"
          git push
